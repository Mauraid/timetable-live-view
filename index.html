<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/lovable-uploads/bb39984d-4845-4fca-a27e-0af6597ae41d.png" type="image/png" />
    <link rel="apple-touch-icon" href="/lovable-uploads/bb39984d-4845-4fca-a27e-0af6597ae41d.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Skate Camp World | Camp Schedule & Sessions" />
    <meta property="og:description" content="Your camp. Your schedule. Your skate. Live session times, locations and instructors." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/lovable-uploads/bb39984d-4845-4fca-a27e-0af6597ae41d.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skate Camp World | Camp Schedule & Sessions" />
    <meta name="twitter:description" content="Your camp. Your schedule. Your skate. Live session times, locations and instructors." />
    <meta property="twitter:image" content="/lovable-uploads/bb39984d-4845-4fca-a27e-0af6597ae41d.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        const isDevelopmentPreview =
          location.hostname === 'localhost' || location.hostname.endsWith('.lovableproject.com');

        if (isDevelopmentPreview) {
          // A service worker must not cache Vite's generated dependency modules.
          // Clear any worker/cache left by an earlier preview before React loads.
          Promise.all([
            navigator.serviceWorker.getRegistrations().then((registrations) =>
              Promise.all(registrations.map((registration) => registration.unregister()))
            ),
            'caches' in window
              ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
              : Promise.resolve(),
          ]).then(() => {
            if (navigator.serviceWorker.controller && !sessionStorage.getItem('sw-preview-cleaned')) {
              sessionStorage.setItem('sw-preview-cleaned', 'true');
              location.reload();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((registrationError) => {
              console.warn('Service worker registration failed:', registrationError);
            });
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
